# =============================================================================
#  PIPELINE DE INTEGRACIÓN CONTINUA
#  Taller 1 - Unidad II - Automatización de Pruebas
#
#  Disparadores: cada push y cada pull request sobre main/develop.
#  Etapas: build -> pruebas unitarias -> pruebas BDD -> performance -> reportes
# =============================================================================
name: CI - Pruebas Automatizadas

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:        # permite lanzarlo manualmente desde la interfaz
  schedule:
    - cron: '0 8 * * 1-5'   # regresión diaria en días hábiles (08:00 UTC)

# -----------------------------------------------------------------------------
# Permisos del token del pipeline.
# Por seguridad, GitHub entrega por defecto un token de solo lectura. Aquí se
# conceden EXPLÍCITAMENTE y de forma mínima los permisos que cada acción
# necesita: publicar el reporte de pruebas (checks), desplegar el dashboard
# (contents) y crear el issue automático ante un fallo en main (issues).
# -----------------------------------------------------------------------------
permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write

# Cancela ejecuciones antiguas de la misma rama: ahorra minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: compilación + pruebas unitarias y BDD
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build y pruebas (unitarias + BDD)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # cachea ~/.m2 y acelera builds sucesivos

      - name: Compilar el proyecto
        run: mvn -B clean compile

      - name: Ejecutar pruebas unitarias (JUnit 5)
        run: mvn -B test -Dtest='*Test' -DfailIfNoTests=false

      - name: Ejecutar escenarios BDD (Cucumber)
        run: mvn -B test -Dtest='BddTestRunner' -DfailIfNoTests=false

      - name: Generar reporte HTML navegable de Surefire
        if: always()                # se genera incluso si alguna prueba falló
        continue-on-error: true     # el reporte es un extra: no debe tumbar el build
        run: mvn -B surefire-report:report-only

      # --- Reporte navegable dentro de la propia pestaña del build ---
      - name: Publicar resultados de pruebas en el resumen del build
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados de pruebas
          path: 'target/surefire-reports/*.xml,target/cucumber-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      # --- Artefactos descargables por todo el equipo ---
      - name: Publicar reporte de pruebas unitarias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-unitarias
          path: |
            target/surefire-reports/
            target/site/
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar reporte BDD (HTML navegable)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-reports/
          retention-days: 30
          if-no-files-found: warn

      # --- Resumen legible en la portada de la ejecución ---
      - name: Escribir resumen del build
        if: always()
        run: |
          echo "## Resultado de las pruebas automatizadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Archivo de resultados |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "| $(basename "$f" .txt) | $(grep -h 'Tests run' "$f" | head -1) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los reportes navegables (HTML de Cucumber y de Surefire) están disponibles en la sección **Artifacts** de esta ejecución." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # JOB 2: prueba de performance (solo si las funcionales pasaron)
  # ---------------------------------------------------------------------------
  performance:
    name: Prueba de performance (k6)
    runs-on: ubuntu-latest
    needs: build-and-test     # dependencia explícita entre etapas

    steps:
      - uses: actions/checkout@v4

      - name: Preparar carpeta de resultados
        run: mkdir -p performance/resultados

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # -----------------------------------------------------------------------
      # k6 devuelve códigos de salida distintos según lo que ocurrió, y no todos
      # significan lo mismo:
      #     0  -> todos los umbrales (SLO) se cumplieron
      #    99  -> la prueba corrió, pero uno o más umbrales no se cumplieron
      #  otro  -> la herramienta no pudo completar la prueba (error real)
      #
      # Tratarlos todos igual sería un error de diseño: una degradación de
      # performance es una ALERTA que el equipo debe evaluar, mientras que un
      # fallo de la herramienta es un ERROR que invalida la medición. Aquí se
      # distinguen explícitamente en vez de usar un continue-on-error genérico.
      # -----------------------------------------------------------------------
      - name: Ejecutar prueba de carga sobre el login
        id: k6
        run: |
          set +e
          k6 run performance/login-performance.js | tee performance/resultados/salida-k6.txt
          CODIGO=${PIPESTATUS[0]}
          set -e

          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

          # El resumen de métricas queda visible en la portada de la ejecución,
          # sin necesidad de descargar el artefacto.
          {
            echo "## Resultado de la prueba de performance"
            echo ""
            echo '```'
            sed -n '/RESUMEN DE PERFORMANCE/,$p' performance/resultados/salida-k6.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$CODIGO" in
            0)
              echo "::notice title=Performance dentro de los umbrales::Todos los SLO definidos se cumplieron."
              ;;
            99)
              echo "::warning title=Degradacion de performance detectada::Uno o mas umbrales (latencia p95/p99, tasa de error o throughput) no se cumplieron. El pipeline continua porque es una alerta para el equipo, no un bloqueo del merge. Revisar el resumen de esta ejecucion."
              ;;
            *)
              echo "::error title=Fallo al ejecutar k6::k6 termino con codigo $CODIGO. No es una degradacion de performance: la herramienta no pudo completar la prueba y la medicion no es valida."
              exit "$CODIGO"
              ;;
          esac

      - name: Publicar resultados de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-performance-k6
          path: performance/resultados/
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # JOB 3: publicación del dashboard y alertas
  # ---------------------------------------------------------------------------
  reportes-y-alertas:
    name: Dashboard y alertas
    runs-on: ubuntu-latest
    needs: [ build-and-test, performance ]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los reportes
        uses: actions/download-artifact@v4
        with:
          path: reportes/

      # Publica los reportes en GitHub Pages: URL fija y navegable para todo el
      # equipo, sin necesidad de descargar artefactos.
      # Requiere tener Pages habilitado en Settings > Pages > Source: gh-pages.
      - name: Publicar dashboard en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # si Pages no está habilitado, no tumba el pipeline
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reportes
          destination_dir: dashboard

      # ---- ALERTAS AUTOMÁTICAS ----
      # Requieren el secret SLACK_WEBHOOK_URL. Si no está configurado, el paso
      # se omite silenciosamente en vez de fallar.
      - name: Alerta a Slack ante fallo del pipeline
        if: needs.build-and-test.result == 'failure' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":rotating_light: *Build fallido* en `${{ github.repository }}`\n*Rama:* ${{ github.ref_name }}\n*Autor:* ${{ github.actor }}\n*Commit:* ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución y reporte>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Alerta por degradación de performance
        if: needs.performance.result == 'failure' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":chart_with_downwards_trend: *Degradación de performance detectada*\nSe incumplieron los umbrales de latencia p(95) o tasa de error en el login.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Revisar resultados k6>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Crear issue automático ante fallo en main
        if: needs.build-and-test.result == 'failure' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] Fallo automático en main - run #${context.runNumber}`,
              body: `El pipeline falló en el commit ${context.sha}.\nRevisar: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'bug']
            })
